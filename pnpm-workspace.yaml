# Written by `pnpm approve-builds`. Dependencies whose install scripts are allowed to run:
# esbuild and workerd (via wrangler). `allowBuilds` is pnpm 11 syntax; the packageManager
# version in package.json is pinned to it.
#
# protobufjs (via centrifuge) stays denied. The relay talks JSON; protobuf is unused.
allowBuilds:
  esbuild: true
  protobufjs: false
  workerd: true
